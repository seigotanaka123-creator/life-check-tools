<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>External Town Layer Restore</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(15,23,42,.88);
      box-shadow: 0 24px 80px rgba(0,0,0,.36);
    }
    a { color: #93c5fd; }
    code { color: #fde68a; }
  </style>
</head>
<body>
<main>
  <h1>外部ブラウザの街レイヤー復元中</h1>
  <p>外部ブラウザ側の保存データに、街の発展レイヤーが表示される建設済み状態を反映しています。</p>
  <p id="status">処理中です。</p>
</main>
<script>
(function restoreExternalTownLayer() {
  const status = document.getElementById("status");
  const allTownBuildings = [
    "warehouse",
    "fountain",
    "bridge",
    "clock",
    "shop",
    "guild",
    "station",
    "castle",
    "medalHall",
    "soundShop",
    "bookstore",
    "retirePark",
    "arcade",
    "statue1",
    "statue2"
  ];
  const stateKey = "lifeQuestWalkV1";
  const version = "20260706-1118-external-town-layer";

  function readState() {
    try {
      const raw = localStorage.getItem(stateKey);
      return raw ? JSON.parse(raw) : {};
    } catch (error) {
      return {};
    }
  }

  function unique(values) {
    return Array.from(new Set(values.filter(Boolean)));
  }

  const state = readState();
  state.townBuildings = unique([...(Array.isArray(state.townBuildings) ? state.townBuildings : []), ...allTownBuildings]);
  state.coins = Math.max(Number(state.coins || 0), 999999);
  state.coin = Math.max(Number(state.coin || 0), 999999);
  state.lastExternalTownLayerRestore = version;

  localStorage.setItem(stateKey, JSON.stringify(state));
  localStorage.setItem("imasoraTownVisualBaselineV20260705", "1");
  localStorage.setItem("imasoraTownLayeredSpriteBaselineV20260705", "1");
  localStorage.setItem("imasoraExternalTownLayerRestoreVersion", version);

  status.innerHTML = "復元しました。外部ブラウザ用の確認ページへ移動します。";
  setTimeout(() => {
    location.href = "life-quest-walk-external-fresh-20260706-1105.html?restored=external-town-layer-20260706-1118";
  }, 350);
})();
</script>
</body>
</html>
