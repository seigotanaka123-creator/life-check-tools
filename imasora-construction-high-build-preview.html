<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>空へつづく見晴らし台｜イマソラーズウォーク</title><link rel="stylesheet" href="./assets/imasora-construction-high-build.css?v=120fc"></head>
<body><main id="play"><div id="scene" aria-label="見晴らし台と外側の作業塔"></div>
<header><div><small>イマソラーズウォーク · 高所建築の試作</small><h1>空へつづく見晴らし台</h1></div><button id="help" aria-label="遊び方">？</button></header>
<div id="progress" aria-label="完成した階"><span>1階</span><span>2階</span><span>3階</span></div>
<aside id="stock" aria-label="残りの材料"></aside><div id="camera"><button id="front">正面</button><button id="side">横から</button><button id="top">上から</button></div>
<section id="actions"><p id="message" role="status">現場を準備しているよ…</p><div class="meter"><i id="bar"></i></div><div class="buttons"><button id="undo" disabled>↶ 1つ前にもどす</button><button id="primary" disabled>準備中</button><button id="pause" hidden>ひと休み</button></div><small id="saved">この試作の作業だけを自動保存。いつもの材料やセーブは使いません。</small></section>
<dialog id="guide"><h2>地上でつくって、空でつなごう！</h2><ol><li><b>部材をつくる</b><br>柱・梁・床を地上でそろえるよ。</li><li><b>リフトで運ぶ</b><br>重い部材は外側のリフトにおまかせ。</li><li><b>登って組む</b><br>モンスターが階段を登り、長い組立て道具でつなぐよ。</li></ol><p>作業台と階段はずっと同じ形。建物の上を覆わないよ。画面をスライドすると見回せるよ。</p><p class="scope">まず3階までの試作です。本体の材料・地形への接続や自由な形は、次の工程で進めます。</p><button id="close">現場へもどる</button></dialog>
<script type="module" src="./assets/imasora-construction-high-build-view.mjs?v=120fp"></script></main></body></html>
