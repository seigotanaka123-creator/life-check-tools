<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>坂道で土を運ぼう｜イマソラーズウォーク</title><link rel="stylesheet" href="imasora-construction-dump-grade-dev.css"><script src="assets/imasora-game-touch-guard.js"></script></head>
<body><main data-game-gesture-surface aria-label="ダンプカーの坂道練習"><canvas id="scene" tabindex="0" aria-label="土を積んだダンプカーと坂道"></canvas><header class="top"><div><h1>坂道で土を運ぼう</h1><span>練習用の土48個・通常の素材とは別です</span></div><button id="menu-open">メニュー</button></header><section class="meters" aria-label="車両の状態"><strong id="cargo">荷台48個</strong><span id="speed">停車中</span><span id="grade">坂0°</span><progress id="load-bar" max="48" value="48" aria-label="荷台の土の量"></progress></section><p id="status" role="status">ロード中</p><nav class="tools"><button id="stock">土を積込所へ戻す</button><button id="camera">視点：後方</button><button id="save">作業を保存</button></nav><div id="pad" class="construction-move-pad" role="group" aria-label="スライド式移動パッド"><span data-move-stick aria-hidden="true"></span></div><button id="dash" class="dash">高速</button><button id="brake" class="brake">ブレーキ</button><p class="keys">W：前進　S：後退　A/D：ハンドル　Space：ブレーキ<br>キーを離すと停車。画面をドラッグして視点を変えられます。</p></main>
<dialog id="menu"><form method="dialog"><header><h2>坂道の練習</h2><button>現場へ戻る</button></header></form><p>積荷が重いほど坂道でゆっくり走ります。急な斜面・段差・道路の端では停止します。後退して安全な道へ戻ってください。</p><button id="gentle">緩やかな坂で練習する</button><button id="steep">急な坂で停止を試す</button><button id="read">保存した作業を再開</button><button id="export">控えを作る</button><button id="restore">控えから復元</button><button id="undo" disabled>復元前の作業に戻す</button><label for="backup">作業の控え</label><textarea id="backup" spellcheck="false"></textarea><section id="confirm" hidden><p id="compare"></p><button id="confirm-yes">確認して復元</button><button id="confirm-no">やめる</button></section><p id="menu-status" role="status"></p></dialog><script type="module" src="imasora-construction-dump-grade-dev.js"></script></body></html>
