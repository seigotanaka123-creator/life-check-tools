<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>雲のレース｜イマソラーズウォーク</title><link rel="stylesheet" href="assets/imasora-independent-races.css?v=1211t"></head><body class="sky-race"><canvas id="race" tabindex="0" inputmode="none" aria-label="雲のレースのゲーム画面"></canvas><header class="race-hud"><strong>雲のレース</strong><output id="status" role="status"></output><button id="pause">ひと休み</button></header><div class="race-cue" id="cue" aria-hidden="true"></div><div class="race-controls" aria-label="雲のレースの操作"><div class="race-pad" data-pad role="group" aria-label="移動パッド"><i></i></div><div class="actions"><button data-action="dash">ダッシュ</button><button data-action="jump">ジャンプ</button></div></div><section class="race-setup" id="setup" aria-labelledby="race-title"><span class="game-badge">雲マップの遊び</span><h1 id="race-title">雲のレース</h1><p class="intro">相棒と雲を蹴って、空のゴールへ。風を読み、弾む雲を踏み切って、分かれ道を跳び渡ろう。</p><div class="race-grid"><section class="race-card"><h2>相棒の走りを整える</h2><div id="parts"></div></section><section class="race-card"><h2>雲の道をえらぶ</h2><div class="course-choice"><button data-course="terraces">段雲のぼり<small>広い雲と高い雲。着地しやすい道と短い道を選ぼう。</small></button><button data-course="windway">風わたる雲の道<small>左右に離れた分かれ雲。風に流されるぶんを見越して跳ぼう。</small></button></div><p>旗を順に通り、上のゴールへ先に着けば勝ち。落ちても直前の旗から再開。落下1回につき2秒が加わるよ。</p><p>パッド：向けた方向へ移動。ジャンプとダッシュを同時に使えるよ。PC：WASD／矢印で移動、Space／Jでジャンプ、Shiftでダッシュ。</p></section></div><p id="result" role="status"></p><div class="race-start"><button id="resume" hidden>つづきから</button><button id="go">雲の道へ出発</button></div><p class="race-note">部品を自由に試せるレースです。育成や持ちものは変わりません。ひと休み中は相手も止まります。</p><a id="return-map" href="imasora-world-3d-dev.html?race-return=sky">雲マップへ戻る</a></section><script type="module" src="assets/imasora-sky-race-view.mjs?v=1211t"></script></body></html>
