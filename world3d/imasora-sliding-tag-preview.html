<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>すべる鬼ごっこ｜イマソラーズウォーク</title><link rel="stylesheet" href="./assets/imasora-sliding-tag.css?v=120rn"><link rel="stylesheet" href="./assets/imasora-keyboard-settings.css"><style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body,main{margin:0;width:100%;height:100%;overflow:hidden}body{background:#b8dce8;color:#345b69;font-family:system-ui,sans-serif}#rink{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}button,a{touch-action:manipulation}button{font:700 17px system-ui;color:#345b69;border:2px solid #fff;border-radius:20px;background:#d8f1e8;box-shadow:0 4px 0 #83b9b760;min-height:48px;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{background:#ffe0a0;border-color:#e4a548;box-shadow:0 4px 0 #d89e4260}button:disabled{opacity:.65;cursor:default}.game-hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}.game-hud>*{pointer-events:auto}#hud{display:block;background:#f7fcffeb;border:2px solid #fff;border-radius:20px;padding:10px 15px;font-size:15px;font-weight:bold}#pause{min-height:44px;padding:8px 16px}#count{position:fixed;top:23%;left:50%;transform:translateX(-50%);font-size:60px;font-weight:900;color:#fff;text-shadow:0 3px #588994;pointer-events:none;z-index:6}#notice{position:fixed;bottom:25%;left:50%;transform:translateX(-50%);border:2px solid #fff;border-radius:20px;background:#fff7dfec;padding:10px 16px;max-width:70vw;font-weight:bold;pointer-events:none;z-index:6}#bell-alert{position:fixed;top:38%;border:3px solid #fff;background:#fff0ac;border-radius:20px;padding:6px 9px;display:grid;justify-items:center;font-size:26px;pointer-events:none;z-index:6}#bell-arrow{display:block;font-size:22px;line-height:1}.controls{display:none}.playing #pad.controls,.playing #pair.controls{display:block}#pad{position:fixed;transform:translate(-50%,-50%);width:126px;height:126px;border:3px solid #fff;border-radius:50%;background:#d7f0f870;touch-action:none;z-index:7}#pad i{position:absolute;left:40px;top:40px;width:40px;height:40px;border:2px solid #fff;border-radius:50%;background:#e6f8ff}#pair{position:fixed;transform:translate(-50%,-50%);width:130px;height:116px;pointer-events:none;z-index:7}#dash,#jump{position:absolute;width:72px;height:72px;min-height:72px;border-radius:50%;padding:6px;pointer-events:auto;font-size:15px;touch-action:none}#dash{left:0;top:0;right:auto;bottom:auto;background:#ffdf99}#jump{left:54px;top:40px;right:auto;bottom:auto;background:#c9eafa}#use{position:absolute;left:-8px;bottom:132px;width:120px;min-height:58px;font-size:14px;background:#f5d6ed;pointer-events:auto;touch-action:none;padding:5px 8px}#use b{font-size:24px;display:block;line-height:1.2}#use small{font-size:12px;font-weight:bold}
#panel{position:fixed;inset:0;display:grid;place-items:center;background:#92bdce55;z-index:10;padding:10px}#panel .card{background:#fffdf2f5;border:3px solid #fff;border-radius:30px;padding:22px;width:min(840px,96vw);max-height:90dvh;overflow:auto;box-shadow:0 8px 24px #35556938;text-align:center}#panel h1{font-size:27px;margin:0 0 8px}#panel p{line-height:1.5;margin:9px 0}#note{font-size:15px}#roles{font-weight:bold;color:#5d6d89}#areas{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0}#areas button{min-height:44px;font-size:15px;padding:7px 12px}#opponent-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}.opponent-slot{padding:10px 8px;background:#ffddc4}.opponent-slot:nth-child(2){background:#cdeaf8}.opponent-slot:nth-child(3){background:#d7efcf}.opponent-slot b{display:block;font-size:17px;margin-bottom:5px}.opponent-slot strong{font-size:14px;display:block;overflow-wrap:anywhere}.opponent-slot small{display:block;font-size:12px;margin-top:5px}.opponent-slot span{font-size:12px;display:block;margin-top:6px}#begin,#resume{background:#ffdf9a;margin:10px 5px;font-size:20px;min-width:200px}#resume{background:#c8eddc}#observe{font-size:14px;min-height:40px;margin:4px}#panel details{border:2px solid #dfebe8;border-radius:20px;padding:10px;margin-top:10px;background:#f3faf5}#panel summary{font-size:16px;font-weight:bold;cursor:pointer}#start-items{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:12px}#start-items button{padding:7px 4px;min-height:74px;background:#ecf2ff}#start-items button[aria-pressed=true]{background:#ffe4a6}#start-items span{font-size:27px;display:block}#start-items small{font-size:11px;font-weight:bold}#item-hint{font-size:14px}#best,#companion-note,.practice-note{font-size:13px;color:#53737d}#home-return{display:inline-block;font-size:14px;color:#3c6e88;padding:10px}#keys{max-height:420px;overflow:auto}.tag-select header{position:static;pointer-events:auto}.tag-select .ts-grid button{min-height:80px}.tag-select{z-index:30}
@media(max-width:600px){#panel .card{padding:15px 12px}#panel h1{font-size:23px}#start-items{grid-template-columns:repeat(4,minmax(0,1fr))}.opponent-slot{padding:8px 5px}.opponent-slot strong{font-size:12px}.opponent-slot b{font-size:15px}.opponent-slot span{font-size:11px}#opponent-slots{gap:6px}#begin,#resume{min-width:170px;font-size:18px}#panel p{margin:7px 0}#hud{font-size:14px;padding:9px 12px}}
@media(max-height:480px){#panel .card{max-height:95dvh;padding:14px}#panel h1{font-size:22px}#opponent-slots{margin:10px 0}.opponent-slot{padding:7px}#areas{margin:7px 0}}
.playing #pair.controls{display:block!important}

body.hunt #pair #dash,body.hunt #pair #jump{width:72px;height:72px;min-height:72px;transform:none;border-radius:50%;padding:4px;font-size:14px;line-height:1.1;letter-spacing:0;white-space:nowrap}body.hunt #pair #use{width:120px;height:auto;min-height:62px;transform:none;border-radius:18px;padding:5px 8px;font-size:14px;line-height:1.1}body.hunt #pair #use small{font-size:11px;font-weight:bold;line-height:1.25;display:block;white-space:nowrap}.item-icon{display:block;width:32px;height:32px;margin:0 auto 3px}#start-items .item-icon{width:30px;height:30px}
body.hunt #pair #use{left:-8px;right:auto;top:auto;bottom:132px}
@media(pointer:fine) and (min-width:1001px){body.hunt.playing #pair.controls{left:auto!important;right:22px;top:auto!important;bottom:26px;transform:none}body.hunt #pair #use{bottom:0;left:0}body.hunt #pad,body.hunt #pair #dash,body.hunt #pair #jump{display:none!important}}
#notice{top:76px;bottom:auto;font-size:14px;max-width:min(72vw,360px)}
.threat-cue{position:fixed;width:22px;height:25px;pointer-events:none;z-index:4;filter:drop-shadow(0 1px 2px #fff);transform:translate(-50%,-50%) rotate(var(--bearing));color:var(--role-color)}.threat-cue svg{width:100%;height:100%}.threat-cue[data-preparing=true]{filter:drop-shadow(0 0 5px #fff7c4)}
</style></head><body class="hunt"><main><canvas id="rink" tabindex="0" aria-label="広い氷の街で鬼3匹から逃げるフィールド"></canvas><header class="game-hud"><output id="hud">鬼3匹</output><button id="pause">ひと休み</button></header><div id="count" hidden></div><output id="notice" hidden></output><div id="bell-alert" aria-label="設置したみはり鈴が反応" hidden><span>🔔</span><span id="bell-arrow">↑</span></div><div class="controls" id="pad" aria-label="移動パッド"><i></i></div><div class="controls" id="pair"><button id="dash">ダッシュ</button><button id="jump">ジャンプ</button><button id="use">道具</button></div><section id="panel" aria-busy="true" aria-label="鬼ごっこの準備"><div class="card"><h1 id="title">すべる鬼ごっこ</h1><p id="note">跳ぶ・曲がる・道具を使う。3匹を出し抜こう！</p><p id="roles">追跡役・先回り役・巡回役</p><div id="opponent-slots"></div><div id="areas" role="group" aria-label="開始場所"><button data-start="boulevard" disabled>大通り</button><button data-start="hill" disabled>氷の丘</button><button data-start="courtyard" disabled>中庭</button><button data-start="garden" disabled>庭のこみち</button><button data-start="basin" disabled>氷のくぼ地</button></div><button id="resume" hidden>つづける</button><button id="begin" disabled>あそぶ</button><br><button id="observe">まわりを見わたす</button><p id="best"></p><details><summary>🎀 持っていく道具をえらぶ</summary><div id="start-items"></div><p id="item-hint"></p></details><details><summary>音・操作設定</summary><button id="sound-toggle" aria-pressed="true">🔊 効果音：オン</button><div id="keys"></div></details><p id="companion-note"></p><a id="home-return" href="../life-quest-walk.html">育成画面へ</a><p class="practice-note">練習用。いつもの育成・持ちものはそのまま。</p></div></section></main><script src="./assets/imasora-keyboard-settings.js"></script><script src="./assets/imasora-sliding-tag-entry.js"></script><script type="module" src="./assets/imasora-sliding-tag-view.mjs?v=120rn"></script></body></html>
